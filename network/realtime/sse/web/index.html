<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SSE resume demo (:8095 → :8096)</title>
    <style>
      body {
        font-family: monospace;
        max-width: 640px;
        margin: 2rem auto;
      }
      button {
        padding: 0.4rem;
        margin: 0.2rem;
      }
      #log {
        border: 1px solid #ccc;
        height: 200px;
        overflow-y: scroll;
        padding: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>SSE: server pushes, browser resumes</h1>
    <p>Page origin: <b>:8095</b>. API: <b>:8096</b> (CORS-open for :8095).</p>
    <button id="connect">Connect</button>
    <button id="kill">Connect (server kills after 3)</button>
    <button id="close">Close</button>
    <button id="clear">Clear</button>
    <div id="log"></div>
    <script>
      let es = null;
      const log = document.getElementById("log");
      const add = (t) => {
        const d = document.createElement("div");
        d.textContent = t;
        log.prepend(d);
      };
      const attach = (url) => {
        if (es) es.close();
        es = new EventSource(url);
        es.onopen = () => add("open (200 text/event-stream)");
        es.addEventListener("tick", (e) =>
          add("← id=" + e.lastEventId + " " + e.data),
        );
        es.onerror = () =>
          add("! error/closed → browser retries with Last-Event-ID");
      };
      document.getElementById("connect").onclick = () =>
        attach("http://localhost:8096/events");
      document.getElementById("kill").onclick = () =>
        attach("http://localhost:8096/events?kill_after=3");
      document.getElementById("close").onclick = () => {
        if (es) es.close();
        add("closed by user (no retry)");
      };
      document.getElementById("clear").onclick = () => (log.innerHTML = "");
    </script>
  </body>
</html>
