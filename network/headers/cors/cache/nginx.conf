events {
  worker_connections 1024;
}

http {
  server_tokens off; # Hide nginx version signature (own header, not upstream)
  # Default key = scheme + host + uri + args. No Origin:
  # different Origins share one entry (the bug this PoC shows).
  proxy_cache_path /tmp/cache keys_zone=gocache:1m;

  server {
    listen 80;

    location / {
      proxy_pass http://host.docker.internal:8090;             # Forward to "application server"
      proxy_cache gocache;                                     # Use cache zone named "gocache"
      proxy_cache_valid 200 60s;                               # Cache responses has http status 200 for 60 seconds
      # proxy_hide_header Server;                                # Hide backend signature (prod-like)
      add_header X-Cache-Status $upstream_cache_status always; # Add a header to show cache status (HIT, MISS, etc.)
    }
  }
}
