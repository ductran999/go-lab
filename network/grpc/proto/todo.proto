syntax = "proto3";

package todo.v1;

option go_package = "go-lab/network/grpc/internal/pb;todopb";

// Todos: unary CRUD plus a server-streaming watch. The stream is
// the gRPC answer to SSE: typed, resumable by id, multiplexed.
service Todos {
  rpc Create(CreateRequest) returns (Todo);
  rpc Get(GetRequest) returns (Todo);
  rpc Watch(WatchRequest) returns (stream TodoEvent);
  rpc Chat(stream ChatMsg) returns (stream ChatMsg);
}

message Todo {
  int64 id = 1;
  string task = 2;
  bool done = 3;
}

message CreateRequest {
  string task = 1;
}

message GetRequest {
  int64 id = 1;
}

message WatchRequest {
  int64 after_id = 1;
}

message TodoEvent {
  int64 id = 1;
  string type = 2;
  Todo todo = 3;
}

message ChatMsg {
  string from = 1;
  string text = 2;
}
