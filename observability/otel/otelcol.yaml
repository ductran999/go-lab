receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Demo: mask anything looking like an email in span attributes.
  # Prod: allowlist keys instead (allow_all_keys: false + allowed_keys).
  redaction/pii:
    allow_all_keys: true
    blocked_values:
      - ".*@.*\\..*"

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [redaction/pii, batch]
      exporters: [otlp/jaeger, debug]
