<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OIDC Client - Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      .box {
        border: 1px solid #ccc;
        padding: 15px;
        margin-top: 20px;
        border-radius: 5px;
      }
      button {
        padding: 10px 15px;
        cursor: pointer;
        font-size: 16px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Welcome Header: Will be updated dynamically using ID Token -->
    <h2 id="welcome-header">Welcome!</h2>

    <!-- UI State: Unauthenticated -->
    <div id="login-section" class="box">
      <p>
        You are not logged in. Click below to sign in via our custom OIDC
        Server.
      </p>
      <button onclick="loginWithOIDC()">Login with OIDC (PKCE)</button>
    </div>

    <!-- UI State: Authenticated -->
    <div id="dashboard-section" class="box hidden">
      <h3 id="welcome-message" style="color: blue">Welcome!</h3>
      <button onclick="logout()">Logout</button>
    </div>

    <script>
      const BACKEND_URL = "http://localhost:8080";
      const CLIENT_ID = "my_oidc_client";
      const REDIRECT_URI = `${BACKEND_URL}/oauth/callback`;

      // 1. Helper to decode JWT (ID Token) payload locally without contacting Server
      function parseJwt(token) {
        const base64Url = token.split(".")[1];
        const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
        return JSON.parse(window.atob(base64));
      }

      // PKCE Helpers
      function generateVerifier() {
        const array = new Uint32Array(32);
        window.crypto.getRandomValues(array);
        return Array.from(array, (dec) =>
          ("0" + dec.toString(16)).substr(-2),
        ).join("");
      }

      async function generateChallenge(verifier) {
        const encoder = new TextEncoder();
        const data = encoder.encode(verifier);
        const hash = await window.crypto.subtle.digest("SHA-256", data);
        return btoa(String.fromCharCode(...new Uint8Array(hash)))
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/, "");
      }

      // 2. Open OIDC popup
      async function loginWithOIDC() {
        const verifier = generateVerifier();
        const challenge = await generateChallenge(verifier);

        sessionStorage.setItem("pkce_verifier", verifier);

        const width = 500,
          height = 600;
        const left = (window.innerWidth - width) / 2;
        const top = (window.innerHeight - height) / 2;

        // OIDC Standard: Scope MUST include "openid profile email"
        const authorizeURL = `${BACKEND_URL}/oauth/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=openid+profile+email&code_challenge=${challenge}&state=custom_random_state`;

        window.open(
          authorizeURL,
          "OIDCPopup",
          `width=${width},height=${height},top=${top},left=${left}`,
        );
      }

      // 3. Listen for code from the popup
      window.addEventListener("message", async (event) => {
        if (event.origin !== BACKEND_URL) return;

        const { code } = event.data;
        if (code) {
          await exchangeCodeForOIDC(code);
        }
      });

      // 4. POST to /oauth/token to exchange code for Access Token + ID Token
      async function exchangeCodeForOIDC(code) {
        const verifier = sessionStorage.getItem("pkce_verifier");

        const formData = new URLSearchParams();
        formData.append("code", code);
        formData.append("client_id", CLIENT_ID);
        formData.append("code_verifier", verifier);

        try {
          const response = await fetch(`${BACKEND_URL}/oauth/token`, {
            method: "POST",
            body: formData,
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
          });

          if (!response.ok) throw new Error("Token exchange failed");

          const data = await response.json();

          // Store both tokens
          localStorage.setItem("my_access_token", data.access_token);
          localStorage.setItem("my_id_token", data.id_token); // The Identity JWT!

          checkLoginStatus();
        } catch (error) {
          alert("Error exchanging code: " + error.message);
        }
      }

      // 5. Check login status
      function checkLoginStatus() {
        const idToken = localStorage.getItem("my_id_token");
        if (idToken) {
          try {
            // DECODE THE ID TOKEN LOCALLY - NO NETWORK / API CALL NEEDED!
            const payload = parseJwt(idToken);

            document.getElementById("login-section").classList.add("hidden");
            document
              .getElementById("dashboard-section")
              .classList.remove("hidden");
            document.getElementById("welcome-header").innerText =
              `Welcome, ${payload.name}!`;
            document.getElementById("welcome-message").innerText =
              `Successfully authenticated as ${payload.email} using decrypted ID Token.`;
          } catch (e) {
            logout();
          }
        } else {
          document.getElementById("login-section").classList.remove("hidden");
          document.getElementById("dashboard-section").classList.add("hidden");
          document.getElementById("welcome-header").innerText = "Welcome!";
        }
      }

      function logout() {
        localStorage.removeItem("my_access_token");
        localStorage.removeItem("my_id_token");
        sessionStorage.removeItem("pkce_verifier");
        checkLoginStatus();
      }

      checkLoginStatus();
    </script>
  </body>
</html>
