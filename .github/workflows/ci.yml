name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  verify:
    name: make-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run make check (tidy, vet, build, test)
        run: make check

  lint-check:
    name: golangci-lint-v2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run GolangCI-Lint
        # Pinned binary releases lag the repo Go version (prebuilt with
        # older Go panics loading go1.26 packages). Build v2.6.2 from
        # source with the setup-go toolchain instead: same version,
        # matching toolchain, zero new-linter risk.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2 run --timeout 5m --config .golangci.yml

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan secrets
        run: docker run --rm -v ${{ github.workspace }}:/repo zricethezav/gitleaks:latest detect --source /repo -v
