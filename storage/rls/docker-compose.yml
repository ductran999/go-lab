services:
  db:
    image: postgres:16
    container_name: pg-rls
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_rls_data:/var/lib/postgresql/data
      - ./queries:/labs/queries:ro
    ports:
      # Host port differs from the postgrest lab (5432) to avoid clashes.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    image: migrate/migrate:latest
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations/
      - -database=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_rls_data:
