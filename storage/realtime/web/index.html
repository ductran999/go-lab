<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Realtime PoC</title>
    <style>
      body {
        font-family: monospace;
        max-width: 640px;
        margin: 2rem auto;
      }
      #log {
        border: 1px solid #ccc;
        height: 300px;
        overflow-y: scroll;
        padding: 0.5rem;
      }
      form {
        margin-top: 1rem;
        display: flex;
        gap: 0.5rem;
      }
      input,
      select,
      button {
        padding: 0.4rem;
      }
    </style>
  </head>
  <body>
    <h1>Realtime PoC (Postgres NOTIFY → SSE)</h1>
    <label
      >Tenant:
      <select id="tenant">
        <option value="1">1</option>
        <option value="2">2</option>
      </select>
    </label>
    <button id="connect">Connect</button>
    <button id="disconnect">Disconnect</button>
    <div id="log"></div>
    <form id="form">
      <input id="kind" value="ping" size="8" />
      <input id="msg" placeholder="message" size="30" />
      <button>Send</button>
    </form>

    <script>
      let src = null;
      let token = "";
      const log = document.getElementById("log");
      const add = (text) => {
        const div = document.createElement("div");
        div.textContent = text;
        log.prepend(div);
      };
      document.getElementById("connect").onclick = () => {
        if (src) src.close();
        const t = document.getElementById("tenant").value;
        // EventSource sets no headers: token rides ?token=, resume via
        // Last-Event-ID is automatic on reconnect.
        src = new EventSource("/stream?token=" + encodeURIComponent(token));
        src.onmessage = (e) => add("← id=" + e.lastEventId + " " + e.data);
        src.onerror = () => add("! stream error/closed → retry with Last-Event-ID");
        add("connected as tenant " + t);
      };
      document.getElementById("disconnect").onclick = () => {
        if (src) src.close();
        src = null;
        add("disconnected");
      };
      document.getElementById("form").onsubmit = async (e) => {
        e.preventDefault();
        const res = await fetch("/events", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },
          body: JSON.stringify({
            kind: document.getElementById("kind").value,
            payload: { msg: document.getElementById("msg").value },
          }),
        });
        add("→ POST " + res.status);
      };
      // Mint a demo token whenever the tenant changes.
      document.getElementById("tenant").onchange = async (e) => {
        const res = await fetch("/token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tenant_id: Number(e.target.value) }),
        });
        token = (await res.json()).token;
        add("token minted for tenant " + e.target.value);
      };
      document.getElementById("tenant").dispatchEvent(new Event("change"));
    </script>
  </body>
</html>
