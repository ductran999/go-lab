services:
  db:
    image: postgres:16
    container_name: pg-realtime
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_realtime_data:/var/lib/postgresql/data
    ports:
      # Host port differs from sibling labs (5432 postgrest, 5433 rls).
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    image: migrate/migrate:latest
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations/
      - -database=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_realtime_data:
