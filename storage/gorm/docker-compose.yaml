services:
  db:
    image: postgres:16
    container_name: pg-gorm
    environment:
      POSTGRES_DB: gormdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gormdb"]
      interval: 5s
      timeout: 5s
      retries: 5
