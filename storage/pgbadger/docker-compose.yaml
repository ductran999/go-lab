services:
  db:
    image: postgres:16
    container_name: pg-badger
    environment:
      POSTGRES_DB: badgerdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    # Logging for analysis: slow queries, connects, attribution prefix.
    command:
      - "-c"
      - log_min_duration_statement=200
      - "-c"
      - log_connections=on
      - "-c"
      - log_disconnections=on
      - "-c"
      - log_line_prefix=%t [%p] %u@%d %a
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d badgerdb"]
      interval: 5s
      timeout: 5s
      retries: 5
