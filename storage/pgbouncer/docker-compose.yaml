services:
  db:
    image: postgres:16
    container_name: pg-pool
    # Tiny ceiling on purpose: 10 server conns total. Direct clients
    # beyond that queue/fail; the pool multiplexes hundreds over these 10.
    # Config file mounted (edit ./postgresql.conf, recreate to apply).
    command: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: ${DB_NAME:-pooldb}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
    volumes:
      - pg_pool_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Transaction mode: server conn returned after each transaction.
  # Demo app connects HERE (:6432), never directly to :5435.
  # AUTH_TYPE=scram-sha-256 is required for postgres:14+ (upstream example).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pg-bouncer
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_NAME: ${DB_NAME:-pooldb}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "5"
    ports:
      - "6432:5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_pool_data:
