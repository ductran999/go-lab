services:
  db:
    image: postgres:16
    container_name: pg-jobs
    environment:
      POSTGRES_DB: jobsdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d jobsdb"]
      interval: 5s
      timeout: 5s
      retries: 5
